; World Editor Renewal
; Fisierul acesta este citit inainte de WorldEditor.txt.
; Comentariile incep cu ; sau #. Sectiunile [shortcuts] si [config] sunt doar organizare.

[shortcuts]
; ESC              Curata cursorul
; Delete           Sterge obiectul selectat
; Ctrl+S           Salveaza harta, inclusiv regen.txt si MonsterArrange.txt
; Insert sau F6    Salveaza shadowmap si minimap
; F3               Bound grid
; F7               Interfata
; F11              Wireframe
; R                Reincarca textura
; Z / X            Splat -0.1 / +0.1
; CapsLock         GaussianCubic, cand umbrele sunt afisate
; H                Reincarca inaltimile din .mdatr
; Y                Perspectiva implicita
; T                Camera pentru obiectele din ecran, apoi Insert sau F6
; WASD             Miscare camera
; Sageti           Miscare camera x10
; MouseWheel+1/2/3 Rotatie obiect selectat pe X/Y/Z. Fara selectie, roteste cursorul
; MouseWheel+8     Rotatie obiecte selectate pe Z in jurul pivotului comun
; Ctrl+C           Copiaza obiectele selectate
; Ctrl+V           Lipeste. Tine apasat cam o secunda
; F5               Python, daca ENABLE_PYTHON este pornit si lib38 exista
; MouseWheel+4/5/6 Inaltime cursor +100 / +50 / +5
; MouseWheel+9/0   Muta obiectul pe X / Y
; RShift+9/0       Pas x10
; RCtrl+9/0        Pas x100

[config]
; Optiunile de vizibilitate bifate la pornire
VIEW_CHAR_OUTPUT_BY_DEFAULT   = true
VIEW_SHADOW_OUTPUT_BY_DEFAULT = true
VIEW_WATER_OUTPUT_BY_DEFAULT  = true

; Campul vizual al camerei
WINDOW_FOV_SIZE = 45

; 100 = 1 pixel pentru pasul WASD
WASD_MINIMAL_MOVE = 100

; Dupa Insert/F6 camera ramane unde era
NO_GOTO_AFTER_INSERT = true

; Nu scrie dump-ul MAI la atlas
NOMAI_ATLAS_DUMP = true

; minimap.dds fara alpha, comprimat
NOMINIMAP_RAWALPHA = true

; Citeste inaltimea cladirilor din .mdatr
DETECT_MDATR_HEIGHT = true

; Fara ceata la incarcarea hartii
NOFOG_ONMAPLOAD = true

; Nu rescrie toate bifele la UpdateUI
REFRESHALL_ONUPDATEUI = false

; Prefixul hartilor noi. "" il dezactiveaza
NEW_MAP_MAPNAME_PREFIX = "metin2_map_"

; Textureset folosit la harta noua. "" il dezactiveaza
NEWMAP_TEXTURESETLOADPATH = "textureset\metin2_a1.txt"

; Daca nu exista un path in dialog, textureset-ul se numeste dupa harta
NEWMAP_TEXTURESETSAVEASMAPNAME = true

; server_attr pastreaza bitii 0..7. Nu mai taie bitii 3..7
SERVERATTR_REMOVE_WEIRD_FLAGS = true

; 1 aplica difuzul luminii de character pe copaci. 0 il taie
VIEW_OBJECT_LIGHTING = true

; Calea mob_proto pentru lista de regen. Daca nu se incarca, se incearca locale/en/mob_proto
MOB_PROTO_PATH = "locale/ymir/mob_proto"

; Bifa "View Monster Area" la pornire
VIEW_MONSTER_AREA_INFO = 0

; Culoarea cursorului si a selectiei, RGB intre 0 si 1. Implicit verde
RENDER_CURSOR_COLOR_R = 0.0
RENDER_CURSOR_COLOR_G = 1.0
RENDER_CURSOR_COLOR_B = 0.0

; Limita de inaltime a obiectului, 5000 = 50 m. Trebuie sa fie >= slider-ului
OBJECT_HEIGHT_MAX = 5000

; Jumatatea slider-ului de inaltime, 3000 = 30 m. 0 pe slider inseamna inaltime 0
OBJECT_HEIGHT_SLIDER_MAX = 3000

; 1 ascunde slider-ul de 16 straturi de la attr si nu mai sterge ultimii 4 biti
ATTR_SLIDER_REMOVAL = true

; 1 centreaza fereastra dupa deschidere
CENTERED_WINDOW = true

; Bifa Auto Save la pornire
AUTO_SAVE = false

; Secunde de asteptare cand bifa Auto Save este pornita
AUTO_SAVE_TIME = 60

; EN foloseste resursele din exe. Alt cod incarca WorldEditorRemix_{cod}.dll de langa exe
LOCALE = "EN"

; Python embedded nu este legat in acest build. F5 scrie in log daca este pornit
ENABLE_PYTHON = false

; Limitele de zoom la rotita
MOUSE_WHEEL_MIN = 200.0
MOUSE_WHEEL_MAX = 80000.0

; Imaginea MAI se salveaza fara zonele de monstri
MAI_IMAGE_WITHOUT_MONSTER_AREA_INFO = true

; Efectele intra in minimap cand este true
MINIMAP_EFFECT_SNAPSHOT = false

; Animatiile GR2 raman pornite
ENABLE_GR2_ANIMATION = true

; Latimea hartii de umbra a caracterului, in pixeli
CHARACTER_SHADOW_MAP_SIZE = 512

; Bifa Render Compass la pornire
ENABLE_NEW_COMPASS = true

; Lista obiectelor din zona curenta, in pagina Map Object
ENABLE_OBJECT_HIERARCHY = true

; true alege obiectul prin intersectie. false pastreaza picking-ul vechi
INTERSECT_OBJECT_PICKING = false

; Copiaza folderul hartii inainte de fiecare salvare
AUTO_BACKUP = true
AUTO_BACKUP_FOLDER = "_backup"
; 0 {folder}/{harta}_data, 1 {folder}/{harta}/data, 2 {folder}/data_{harta}, 3 {folder}/data/{harta}
AUTO_BACKUP_SUBFOLDER_MODE = 0

; Export copiaza folderul hartii. Butonul este pe pagina de fisier
EXPORT_FOLDER = "_export"
EXPORT_SUBFOLDER_MODE = 0

; Folosite de scanarea de property, cand va fi legata de un buton
ENABLE_AUTOGEN_PROPERTY = true
AUTOGEN_PROPERTY_EFFECT = true
NEW_OBJECT_ID_FROM_CRC = true

; false: copacii ignora pitch si roll, ca billboard-ul frunzelor sa ramana spre camera
ENABLE_TREE_ROTATION = false

; Apa speciala se pune in Setting.txt al hartii: SpecialWaterPath si SpecialWaterCount (1..30).
; Daca lipsesc, ramane d:/ymir Work/special/water.
; Group Wind (Enable, Strength, Random) se salveaza in scriptul de environment.
; EncryptionSet este scris 0. Nu cripteaza nimic.
